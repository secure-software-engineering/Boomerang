name: Java CI with Maven

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  BuildAndTest:
    name: Test with ${{ matrix.framework }} , ${{ matrix.enableOnTheFlyCallGraph }} , ${{ matrix.sparsification }}
    strategy:
      fail-fast: false
      matrix:
        framework: [ Soot, SootUp, Opal ]
        enableOnTheFlyCallGraph: [ false, true ]
        sparsification: [ none ]
        include:
          - framework: SootUp
            enableOnTheFlyCallGraph: false
            sparsification: typebased
          - framework: SootUp
            enableOnTheFlyCallGraph: true
            sparsification: typebased
          - framework: SootUp
            enableOnTheFlyCallGraph: false
            sparsification: aliasaware
          - framework: SootUp
            enableOnTheFlyCallGraph: true
            sparsification: aliasaware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-package: jdk
          java-version: 17
      - name: Build with Maven
        run: mvn -B clean verify -DtestSetup=${{ matrix.framework }} -DenableOnTheFlyCallGraph=${{ matrix.enableOnTheFlyCallGraph }} -Dsparsification=${{ matrix.sparsification }}
