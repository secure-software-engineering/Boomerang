name: Prepare Release
run-name: Release ${{ inputs.release_type }} triggered by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  prepare-release:
    uses: secure-software-engineering/actions/.github/workflows/maven-release-prepare.yml@c98577761faae44108ba0ec2de7ebd67ddd4b40b # develop
    with:
      release_type: ${{ inputs.release_type }}
      head_branch: develop
      java_version: '17'
      java_distribution: adopt
      tag_pattern: '{major}.{minor}.{patch}'
    secrets:
      release_pat: ${{ secrets.AUTO_MERGE_PAT }}
